global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - crm-service:8082
          - billing-service:8083
          - payment-service:8084
          - purchase-service:8085
          - inventory-service:8086
          - expense-service:8087
          - hr-service:8089
          - helpdesk-service:8090
          - settings-service:8091
          - accounting-service:8092
  - job_name: workers
    static_configs:
      - targets:
          - billing-worker:9101
          - ledger-worker:9102
          - notification-worker:9103
          - scheduler:9104
          - report-worker:9105
