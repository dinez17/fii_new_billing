# Initial ACME challenge site; the application stays private until cutover.
server {
    listen 80;
    listen [::]:80;
    server_name vaniga.fiitech.in sales.fiitech.in customer.fiitech.in platform.fiitech.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fii-billing-acme;
    }
    location / {
        add_header Retry-After 600 always;
        return 503 "FII Billing production setup is in progress.\n";
    }
}
