# Keep ACME renewals available after HTTPS cutover.
server {
    listen 80;
    listen [::]:80;
    server_name sales.fiitech.in customer.fiitech.in platform.fiitech.in;
    location ^~ /.well-known/acme-challenge/ { root /var/www/fii-billing-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sales.fiitech.in;
    if (!-f /var/lib/fii-billing-public/ready) { return 503; }
    ssl_certificate /etc/letsencrypt/live/fii-billing-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fii-billing-prod/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # One public proxy hop: overwrite client-supplied forwarded addresses.
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}

