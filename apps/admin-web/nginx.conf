server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing
  location / {
    try_files $uri /index.html;
  }

  # same-origin API → gateway (no CORS needed).
  # resolver + variable forces nginx to re-resolve the gateway's IP on each
  # request (127.0.0.11 = Docker's embedded DNS) — survives container recreates.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $gateway http://api-gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 256m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
